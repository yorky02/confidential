name: Import retailer sale deals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: cotton-on-import
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify database secret
        run: test -n "$DATABASE_URL" || (echo "Missing DATABASE_URL repository secret" && exit 1)
      - run: python styleleveling/manage.py scrape_sales
