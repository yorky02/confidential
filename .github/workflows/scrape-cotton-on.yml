name: Import retailer sale deals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: retailer-sale-import
  cancel-in-progress: false

jobs:
  scrape:
    name: Import ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Working stores (no Selenium needed)
          - {store: cotton_on, allow_failure: false, use_selenium: false}
          - {store: pacsun, allow_failure: false, use_selenium: false}
          - {store: gap, allow_failure: true, use_selenium: false}
          - {store: asos, allow_failure: false, use_selenium: false}
          - {store: forever21, allow_failure: false, use_selenium: false}
          - {store: uniqlo, allow_failure: false, use_selenium: false}
          
          # Stores that need Selenium
          - {store: hm, allow_failure: false, use_selenium: true}
          - {store: hollister, allow_failure: true, use_selenium: true}
          - {store: urban_outfitters, allow_failure: true, use_selenium: true}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: localhost
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      # ===== INSTALL SYSTEM DEPENDENCIES FOR SELENIUM =====
      - name: Install system dependencies (for Selenium stores)
        if: matrix.use_selenium == true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            firefox \
            xvfb \
            libgtk-3-0 \
            libdbus-glib-1-2 \
            libxt6 \
            libx11-xcb1 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-randr0 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxfixes3 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgl1-mesa-glx \
            libgtk-4-1 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libxshmfence1 \
            fonts-liberation \
            libappindicator1 \
            libxkbcommon0
      
      # ===== INSTALL PYTHON DEPENDENCIES =====
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # ===== INSTALL SELENIUM SPECIFICALLY FOR SELENIUM STORES =====
      - name: Install Selenium and WebDriver (for Selenium stores)
        if: matrix.use_selenium == true
        run: |
          pip install selenium webdriver-manager
      
      # ===== VERIFY SELENIUM INSTALLATION =====
      - name: Verify Selenium installation
        if: matrix.use_selenium == true
        run: |
          python -c "import selenium; print(f'Selenium version: {selenium.__version__}')"
          python -c "from selenium.webdriver.firefox.options import Options; print('Firefox options OK')"
          firefox --version || echo "Firefox not found"
      
      # ===== DATABASE SETUP =====
      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ Missing DATABASE_URL - using SQLite fallback"
            echo "DATABASE_URL=sqlite:///db.sqlite3" >> $GITHUB_ENV
          else
            echo "✅ DATABASE_URL is set"
          fi
      
      - name: Run Django migrations
        run: |
          python styleleveling/manage.py migrate --noinput || echo "Migration skipped"
      
      # ===== RUN THE SCRAPER =====
      - name: Import retailer and verify products
        run: |
          echo "========================================="
          echo "🔄 Importing: ${{ matrix.store }}"
          echo "Selenium mode: ${{ matrix.use_selenium }}"
          echo "========================================="
          
          if [ "${{ matrix.use_selenium }}" = "true" ]; then
            echo "🚀 Running with XVFB (Selenium/Firefox mode)..."
            xvfb-run -a python styleleveling/manage.py scrape_sales \
              --stores "${{ matrix.store }}" \
              --minimum-successful-stores 1
          else
            echo "🚀 Running without Selenium..."
            python styleleveling/manage.py scrape_sales \
              --stores "${{ matrix.store }}" \
              --minimum-successful-stores 1
          fi
      
      # ===== UPLOAD ARTIFACTS ON FAILURE =====
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.store }}
          path: |
            *.log
            *.json
            styleleveling/**/*.log
          retention-days: 7