name: Import retailer sale deals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: retailer-sale-import
  cancel-in-progress: false

jobs:
  scrape:
    name: Import ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {store: cotton_on, allow_failure: false, use_selenium: false}
          - {store: pacsun, allow_failure: false, use_selenium: false}
          - {store: gap, allow_failure: true, use_selenium: false}
          - {store: asos, allow_failure: false, use_selenium: false}
          - {store: forever21, allow_failure: false, use_selenium: false}
          - {store: uniqlo, allow_failure: false, use_selenium: false}
          - {store: hm, allow_failure: false, use_selenium: true}
          - {store: hollister, allow_failure: true, use_selenium: false}
          - {store: urban_outfitters, allow_failure: true, use_selenium: false}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: localhost
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install system dependencies (for Selenium stores)
        if: matrix.use_selenium == true
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox xvfb
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Selenium (for stores that need it)
        if: matrix.use_selenium == true
        run: |
          pip install selenium webdriver-manager
      
      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ Missing DATABASE_URL - using SQLite fallback"
          else
            echo "✅ DATABASE_URL is set"
          fi
      
      - name: Run migrations
        run: |
          python styleleveling/manage.py migrate --noinput || echo "Migration skipped"
      
      - name: Import retailer and verify products
        run: |
          echo "========================================="
          echo "🔄 Importing: ${{ matrix.store }}"
          echo "========================================="
          
          if [ "${{ matrix.use_selenium }}" = "true" ]; then
            echo "Running with XVFB (Selenium mode)..."
            xvfb-run -a python styleleveling/manage.py scrape_sales \
              --stores "${{ matrix.store }}" \
              --minimum-successful-stores 1
          else
            python styleleveling/manage.py scrape_sales \
              --stores "${{ matrix.store }}" \
              --minimum-successful-stores 1
          fi
      
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.store }}
          path: |
            *.log
            *.json
          retention-days: 3